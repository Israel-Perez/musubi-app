name: musubi_app
description: "MUSUBI: compra-venta entre estudiantes de la UTTT (app Android)."
publish_to: 'none'

# versionName+versionCode de Android. Subir el build (+N) en cada entrega a Google Play.
version: 0.1.0+1

environment:
  sdk: ^3.13.5
  flutter: ">=3.47.7"

# Paquetes aprobados en la plantilla inicial (licencia, mantenimiento y seguridad revisados; ver 00-01).
dependencies:
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  # Tokens de sesion en el almacen cifrado del sistema (Android Keystore). BSD-3; 02-01.
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  # Plus Jakarta Sans (OFL 1.1, assets/fonts/OFL.txt), empaquetada: sin descargas en tiempo de ejecucion (02-01).
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
  assets:
    - assets/fonts/OFL.txt
    # Licencia de los iconos Lucide (ISC) que se copian de la maqueta (SCRUM-82).
    - assets/licenses/
    # Aviso de privacidad y terminos (HU-47): fuente unica para la app y la landing.
    - assets/legal/
    # Ilustraciones de la maqueta (WebP de 600 px): hoja "Crea tu cuenta" y
    # catalogo de muestra de dev (SCRUM-82).
    - assets/products/
