# Reglas SAST propias de musubi-app (se suman a --config=auto en el job semgrep).
# Semgrep no tiene parser de Dart: las reglas usan languages: [generic] + regex.
# Referencia: OWASP MASVS. Probadas con archivos de prueba (ver Memoria.md).
rules:
  - id: musubi-dart-todo-marker
    languages: [generic]
    severity: ERROR
    message: >-
      Marcador TODO. Usar NOTE (NN-NN) o NOTE (HU-NN) con su spec duena y registrarlo en
      task.md y Memoria.md (traceability en 4 capas).
    paths:
      include:
        - "lib/**/*.dart"
        - "test/**/*.dart"
        - "integration_test/**/*.dart"
    pattern-regex: (//|/\*)[^\n]*\bTODO\b

  - id: musubi-dart-cleartext-url
    languages: [generic]
    severity: ERROR
    message: >-
      URL http:// en el codigo de la app. La URL de la API viene de config/*.json y fuera de dev
      debe ser HTTPS (RNF-02, MASVS-NETWORK-1).
    paths:
      include:
        - "lib/**/*.dart"
    pattern-regex: "['\"]http://"

  - id: musubi-dart-trust-all-certificates
    languages: [generic]
    severity: ERROR
    message: >-
      Se acepta cualquier certificado TLS. Nunca desactivar la validacion de certificados
      (RNF-02, MASVS-NETWORK-1).
    paths:
      include:
        - "lib/**/*.dart"
    pattern-either:
      - pattern-regex: badCertificateCallback\s*=\s*\([^)]*\)\s*=>\s*true
      - pattern-regex: validateCertificate\s*:\s*\([^)]*\)\s*=>\s*true

  - id: musubi-android-cleartext-in-release
    languages: [generic]
    severity: ERROR
    message: >-
      Trafico HTTP en claro habilitado en el manifiesto o la network security config de release.
      Solo debug/profile permiten 10.0.2.2 (MASVS-NETWORK-1).
    paths:
      include:
        - "android/app/src/main/**/*.xml"
    pattern-either:
      - pattern-regex: usesCleartextTraffic\s*=\s*"true"
      - pattern-regex: cleartextTrafficPermitted\s*=\s*"true"

  - id: musubi-secret-in-dart-define
    languages: [generic]
    severity: ERROR
    message: >-
      Valor sensible pasado con --dart-define o leido con String.fromEnvironment: queda dentro del
      APK y es publico. Las llaves privadas viven solo en musubi-api (00-04, MASVS-STORAGE).
    paths:
      include:
        - "lib/**/*.dart"
        - ".github/**"
        - "scripts/**"
        - "config/**"
    pattern-either:
      - pattern-regex: --dart-define[= ]"?[A-Za-z0-9_]*(SECRET|KEY|TOKEN)[A-Za-z0-9_]*=
      - pattern-regex: fromEnvironment\(\s*['"][A-Za-z0-9_]*(SECRET|KEY|TOKEN)[A-Za-z0-9_]*['"]
