name: release-play

# 02-02 T4 (L-16a): publica la app en Google Play desde GitHub. Se lanza a mano y solo desde main:
# pruebas -> AAB firmado con la llave de subida (secretos del entorno google-play) -> API de Google
# Play -> etiqueta app-vX.Y.Z+N. Guia y secretos: docs/play/README.md. Actions fijadas por SHA (00-04).
on:
  workflow_dispatch:
    inputs:
      track:
        description: "Pista de Google Play (alpha = prueba cerrada)"
        type: choice
        options: [internal, alpha, production]
        default: alpha
      status:
        description: "completed publica al terminar la revision; draft la deja en borrador en Play Console"
        type: choice
        options: [completed, draft]
        default: completed

permissions:
  contents: write # solo para la etiqueta app-v*

concurrency:
  group: release-play
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.47.7"

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: google-play
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Version (lineamiento 11)
        id: version
        run: |
          version=$(sed -n 's/^version: *//p' pubspec.yaml | tr -d '[:space:]')
          tag="app-v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::$tag ya existe: sube version en pubspec.yaml (el +N es el versionCode de Play) y su fila en docs/versionado.md."
            exit 1
          fi
          {
            echo "version=$version"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get

      - name: Pruebas
        run: |
          flutter analyze --fatal-infos --fatal-warnings
          flutter test

      # La URL de la API es publica (va en el APK); config/prod.example.json ya la trae.
      - name: Configuracion de produccion
        run: cp config/prod.example.json config/prod.json

      # La llave solo existe en el runner y en el entorno google-play; nunca se imprime.
      - name: Llave de subida
        env:
          KEYSTORE_B64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      # HU-31: los avisos push necesitan google-services.json (ignorado en git). Sale del secreto del entorno
      # google-play; sin el, la version saldria sin push, asi que el workflow se detiene.
      - name: Firebase
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_B64" ]; then
            echo "::error::Falta el secreto GOOGLE_SERVICES_JSON_B64 (docs/play/README.md, Firebase)."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON_B64" | base64 --decode > android/app/google-services.json

      # SCRUM-125 (MASVS-RESILIENCE): el codigo Dart sale ofuscado y sus simbolos quedan aparte en build/symbols.
      - name: AAB ${{ steps.version.outputs.version }}
        run: >-
          flutter build appbundle --release --obfuscate --split-debug-info=build/symbols
          --dart-define-from-file=config/prod.json

      - name: Firmado con la llave de subida
        run: keytool -printcert -jarfile build/app/outputs/bundle/release/app-release.aab | grep -q "CN=Musubi"

      # Los simbolos nunca se publican (el repo es publico y con ellos se deshace la ofuscacion): van directo a
      # Crashlytics si existe el secreto FIREBASE_CRASHLYTICS_SA_JSON (docs/play/README.md). Sin el se descartan
      # y las trazas de esta version salen ofuscadas en Crashlytics.
      - name: Simbolos a Crashlytics
        env:
          SA_JSON: ${{ secrets.FIREBASE_CRASHLYTICS_SA_JSON }}
        run: |
          if [ -z "$SA_JSON" ]; then
            echo "::warning::Sin FIREBASE_CRASHLYTICS_SA_JSON: las trazas de esta version saldran ofuscadas en Crashlytics."
            echo "Simbolos de Dart: descartados (falta FIREBASE_CRASHLYTICS_SA_JSON)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          umask 077
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/crashlytics-sa.json"
          app_id=$(jq -r '.client[] | select(.client_info.android_client_info.package_name == "com.musubi.app") | .client_info.mobilesdk_app_id' android/app/google-services.json)
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/crashlytics-sa.json" \
            npx --yes firebase-tools@15.35.0 crashlytics:symbols:upload --app="$app_id" build/symbols
          echo "Simbolos de Dart: subidos a Crashlytics" >> "$GITHUB_STEP_SUMMARY"

      - uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.musubi.app
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          releaseName: ${{ steps.version.outputs.version }}
          tracks: ${{ inputs.track }}
          status: ${{ inputs.status }}
          whatsNewDirectory: docs/play/whatsnew

      - name: Etiqueta ${{ steps.version.outputs.tag }}
        env:
          TAG: ${{ steps.version.outputs.tag }}
          TRACK: ${{ inputs.track }}
        # La etiqueta anotada necesita autor: el runner no trae identidad de git.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Google Play ($TRACK)"
          git push origin "$TAG"
          echo "### $TAG en la pista $TRACK de Google Play" >> "$GITHUB_STEP_SUMMARY"

      - name: Limpiar la llave
        if: always()
        run: rm -rf "$RUNNER_TEMP/upload.jks" android/key.properties "$RUNNER_TEMP/crashlytics-sa.json" build/symbols
