version: 2
# cooldown: espera 7 dias antes de proponer versiones recien publicadas (mitiga paquetes comprometidos).
updates:
  - package-ecosystem: pub
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
