# Analisis estricto (01-05). El CI corre: flutter analyze --fatal-infos --fatal-warnings
include: package:very_good_analysis/analysis_options.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Un comentario TODO rompe el analisis: el alcance diferido se marca con NOTE (ID) (00-04).
    todo: error
  exclude:
    - build/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - android/**

linter:
  rules:
    # Se documenta lo publico que no es obvio; no se exige dartdoc en cada miembro.
    public_member_api_docs: false
